<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人桌面助手</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#181825">
    <!-- 引入霞鶩文楷字體供外觀切換使用 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.0.0/style.css">
    <style>
        /* 預設主題：極簡深色 */
        :root {
            --bg-color: #1e1e2e;
            --header-bg: #181825;
            --card-bg: #2a2a3c;
            --panel-bg: #232334;
            --border-color: #313244;
            --text-main: #cdd6f4;
            --text-muted: #a6adc8;
            --accent-blue: #89b4fa;
            --accent-green: #a6e3a1;
            --accent-yellow: #f9e2af;
            --font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
            --base-font-size: 14px;
            --card-padding: 10px 12px;
            --card-gap: 8px;
        }

        /* 主題二：純淨亮白 */
        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --panel-bg: #eef1f6;
            --border-color: #dce1e8;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-blue: #2980b9;
            --accent-green: #27ae60;
            --accent-yellow: #d35400;
        }

        /* 主題三：賽博龐克 */
        [data-theme="cyber"] {
            --bg-color: #0d0e15;
            --header-bg: #07080c;
            --card-bg: #161824;
            --panel-bg: #12141f;
            --border-color: #2a2e45;
            --text-main: #e0fbfc;
            --text-muted: #8d99ae;
            --accent-blue: #00f5d4;
            --accent-green: #fee440;
            --accent-yellow: #f15bb5;
        }

        /* 主題四：森林護眼 */
        [data-theme="forest"] {
            --bg-color: #1b2620;
            --header-bg: #141d18;
            --card-bg: #24332b;
            --panel-bg: #1f2c25;
            --border-color: #31443a;
            --text-main: #e8ecea;
            --text-muted: #9eb0a6;
            --accent-blue: #81b29a;
            --accent-green: #f2cc8f;
            --accent-yellow: #e07a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: var(--base-font-size);
            line-height: 1.5;
            overflow-x: hidden;
            transition: background-color 0.25s, color 0.25s;
        }

        /* 自訂頂部標題與拖曳區 */
        .titlebar {
            position: fixed;
            top: 0;
            left: env(titlebar-area-x, 0);
            width: env(titlebar-area-width, 100%);
            height: env(titlebar-area-height, 36px);
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding: 0 10px;
            -webkit-app-region: drag;
            user-select: none;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .titlebar-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-blue);
            white-space: nowrap;
            margin-right: auto;
        }

        .titlebar-actions {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--card-bg);
            border-color: var(--accent-blue);
        }

        /* 外觀自定義設定面板 */
        .settings-panel {
            display: none;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 12px;
        }

        .settings-panel.open {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
        }

        /* 主內容區 */
        .container {
            margin-top: calc(env(titlebar-area-height, 36px) + 12px);
            padding: 0 14px 20px 14px;
        }

        .status-bar {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .section-title {
            font-size: calc(var(--base-font-size) - 1px);
            font-weight: bold;
            color: var(--accent-yellow);
            margin: 14px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: var(--card-padding);
            margin-bottom: var(--card-gap);
            border-left: 3px solid var(--accent-blue);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .card.task {
            border-left-color: var(--accent-green);
        }

        .card-time {
            font-size: calc(var(--base-font-size) - 2px);
            color: var(--accent-blue);
            font-weight: bold;
        }

        .card-title {
            font-size: var(--base-font-size);
            font-weight: 500;
            margin-top: 2px;
        }

        .card-note {
            font-size: calc(var(--base-font-size) - 2px);
            color: var(--text-muted);
            margin-top: 4px;
        }

        .empty-msg {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 24px 12px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>

<body>

    <!-- 自訂頂部標題列 -->
    <header class="titlebar">
        <div class="titlebar-title">📌 工作助手</div>
        <div class="titlebar-actions">
            <button class="action-btn" onclick="toggleSettings()" title="自定義外觀">🎨</button>
            <button class="action-btn" onclick="resetToken()" title="重設驗證密碼">🔑</button>
            <button class="action-btn" id="refreshBtn" onclick="fetchSchedule(true)">↻</button>
        </div>
    </header>

    <!-- 主要顯示內容 -->
    <main class="container">
        <!-- 外觀設定摺疊面板 -->
        <section class="settings-panel" id="settingsPanel">
            <div class="setting-row">
                <span>🎨 配色主題</span>
                <select id="themeSelect" onchange="updateAppearance()">
                    <option value="dark">極簡深色 (預設)</option>
                    <option value="light">純淨亮白</option>
                    <option value="cyber">賽博龐克</option>
                    <option value="forest">森林護眼</option>
                </select>
            </div>
            <div class="setting-row">
                <span>🔤 顯示字體</span>
                <select id="fontSelect" onchange="updateAppearance()">
                    <option value="sans">微軟正黑體</option>
                    <option value="wenkai">霞鶩文楷</option>
                </select>
            </div>
            <div class="setting-row">
                <span>📏 文字大小</span>
                <select id="sizeSelect" onchange="updateAppearance()">
                    <option value="12px">精巧 (12px)</option>
                    <option value="14px" selected>標準 (14px)</option>
                    <option value="16px">舒適 (16px)</option>
                </select>
            </div>
            <div class="setting-row">
                <span>📐 卡片密度</span>
                <select id="densitySelect" onchange="updateAppearance()">
                    <option value="normal">標準間距</option>
                    <option value="compact">緊湊小方塊</option>
                </select>
            </div>
        </section>

        <div class="status-bar">
            <span id="statusText">正在連線取得資料...</span>
            <span id="notifyStatus"></span>
        </div>

        <div id="contentArea"></div>
    </main>

    <script>
        // =========================================================================
        // 【請修改這裡】填入你部署 Google Apps Script 產生的 /exec 網址（不含 ?token=）
        // =========================================================================
        const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbwiBqKKLFztgwarC0VmxzsRVvWngk-lzqxvV2uzJCC0i70gAzVeN6Ywg9g-ksk3Jb43Ew/exec";


        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW 註冊失敗:', err));
        }

        // --- 外觀自定義控制邏輯 ---
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function updateAppearance() {
            const config = {
                theme: document.getElementById('themeSelect').value,
                font: document.getElementById('fontSelect').value,
                size: document.getElementById('sizeSelect').value,
                density: document.getElementById('densitySelect').value
            };
            localStorage.setItem('assistant_appearance', JSON.stringify(config));
            applyAppearance(config);
        }

        function applyAppearance(config) {
            const root = document.documentElement;

            // 1. 套用配色主題
            if (config.theme === 'dark') {
                root.removeAttribute('data-theme');
            } else {
                root.setAttribute('data-theme', config.theme);
            }

            // 2. 套用字體
            if (config.font === 'wenkai') {
                root.style.setProperty('--font-family', '"LXGW WenKai TC", "Microsoft JhengHei", sans-serif');
            } else {
                root.style.setProperty('--font-family', '"Microsoft JhengHei", -apple-system, sans-serif');
            }

            // 3. 套用字級
            root.style.setProperty('--base-font-size', config.size);

            // 4. 套用卡片密度
            if (config.density === 'compact') {
                root.style.setProperty('--card-padding', '6px 10px');
                root.style.setProperty('--card-gap', '5px');
            } else {
                root.style.setProperty('--card-padding', '10px 12px');
                root.style.setProperty('--card-gap', '8px');
            }
        }

        function loadSavedAppearance() {
            const saved = localStorage.getItem('assistant_appearance');
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('themeSelect').value = config.theme || 'dark';
                document.getElementById('fontSelect').value = config.font || 'sans';
                document.getElementById('sizeSelect').value = config.size || '14px';
                document.getElementById('densitySelect').value = config.density || 'normal';
                applyAppearance(config);
            }
        }

        // --- 驗證與資料抓取邏輯 ---
        function getSecretToken() {
            let token = localStorage.getItem("assistant_secret_token");
            if (!token) {
                token = prompt("請輸入你的桌面助手專屬驗證密碼（僅需輸入一次）：");
                if (token && token.trim() !== "") {
                    localStorage.setItem("assistant_secret_token", token.trim());
                }
            }
            return localStorage.getItem("assistant_secret_token");
        }

        function resetToken() {
            const current = localStorage.getItem("assistant_secret_token") || "";
            const newToken = prompt("請輸入新的驗證密碼：", current);
            if (newToken !== null && newToken.trim() !== "") {
                localStorage.setItem("assistant_secret_token", newToken.trim());
                fetchSchedule(true);
            }
        }

        function getFullApiUrl() {
            const token = getSecretToken();
            return `${BASE_GAS_URL}?token=${encodeURIComponent(token || "")}`;
        }

        function updateNotifyBadge() {
            const badge = document.getElementById('notifyStatus');
            if (!("Notification" in window)) return;
            if (Notification.permission === "granted") {
                badge.textContent = "🔔 通知已開啟";
            } else {
                badge.innerHTML = `<a href="#" style="color:var(--accent-yellow)" onclick="requestNotifyPermission()">點此開啟通知</a>`;
            }
        }

        function requestNotifyPermission() {
            Notification.requestPermission().then(() => updateNotifyBadge());
        }

        function sendDesktopNotification(data) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;

            const summary = `今日有 ${data.events.length} 個行程、${data.tasks.length} 項待辦事項`;
            new Notification("📌 今日工作提醒", {
                body: summary,
                icon: "https://cdn-icons-png.flaticon.com/512/2693/2693507.png"
            });
        }

        function renderDashboard(data) {
            const contentArea = document.getElementById('contentArea');
            document.getElementById('statusText').textContent = `更新時間：${data.updatedAt.split(' ')[1]}`;

            if (!data.hasReminder) {
                contentArea.innerHTML = `<div class="empty-msg">☕ 今日無排定行程與待辦事項<br><span style="font-size:11px;">系統每 30 分鐘自動待命檢查中</span></div>`;
                return;
            }

            let html = '';

            if (data.events.length > 0) {
                html += `<div class="section-title">📅 今日行程 (${data.events.length})</div>`;
                data.events.forEach(ev => {
                    const timeStr = ev.isAllDay ? '全天行程' : `${ev.startTime} - ${ev.endTime}`;
                    const locStr = ev.location ? `<div class="card-note">📍 ${ev.location}</div>` : '';
                    html += `
            <div class="card">
              <div class="card-time">${timeStr}</div>
              <div class="card-title">${ev.title}</div>
              ${locStr}
            </div>`;
                });
            }

            if (data.tasks.length > 0) {
                html += `<div class="section-title">✅ 待辦工作 (${data.tasks.length})</div>`;
                data.tasks.forEach(task => {
                    const dueStr = task.due ? `<div class="card-time" style="color:var(--accent-green);">${task.due}</div>` : '';
                    const noteStr = task.notes ? `<div class="card-note">${task.notes}</div>` : '';
                    html += `
            <div class="card task">
              ${dueStr}
              <div class="card-title">${task.title}</div>
              ${noteStr}
            </div>`;
                });
            }

            contentArea.innerHTML = html;
        }

        async function fetchSchedule(isManual = false) {
            const btn = document.getElementById('refreshBtn');
            const apiUrl = getFullApiUrl();

            if (!localStorage.getItem("assistant_secret_token")) {
                document.getElementById('statusText').textContent = '尚未設定密碼，請點擊 🔑 輸入';
                return;
            }

            btn.textContent = '...';
            btn.disabled = true;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('statusText').textContent = `錯誤：${data.error}`;
                    document.getElementById('contentArea').innerHTML = `<div class="empty-msg">🔒 驗證未通過，請點擊上方 🔑 按鈕輸入正確密碼。</div>`;
                    return;
                }

                renderDashboard(data);

                if (data.hasReminder) {
                    sendDesktopNotification(data);
                } else if (!isManual) {
                    window.close();
                }
            } catch (error) {
                document.getElementById('statusText').textContent = '連線失敗，請檢查網路';
                console.error(error);
            } finally {
                btn.textContent = '↻';
                btn.disabled = false;
            }
        }

        // 初始化執行
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedAppearance();
            updateNotifyBadge();
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission().then(updateNotifyBadge);
            }
            fetchSchedule(false);
        });

        setInterval(() => fetchSchedule(false), 30 * 60 * 1000);
    </script>
</body>

</html>
